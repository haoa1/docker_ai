version: '3.8'

services:
  python-dev:
    build: .
    image: python-dev:3.12
    container_name: 3.12-slim_compose
    # 关键修改：使用 host 网络模式
    network_mode: "host"
    volumes:
      - /work/workspace/:/workspace
      - ~/.ssh:/home/devuser/.ssh:ro
      - ~/.gitconfig:/home/devuser/.gitconfig:ro
      - python-dev-data:/data
    working_dir: /workspace
    environment:
      - TZ=Asia/Shanghai
      - LANG=C.UTF-8
      - PYTHONPATH=/workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    # 注意：使用 host 网络模式后，不需要再声明 networks

volumes:
  python-dev-data:

# 注意：使用 host 网络模式后，顶层的 networks 配置可以删除或保留（但不会被该服务使用）
# networks:
#   dev-network:
#     driver: bridge